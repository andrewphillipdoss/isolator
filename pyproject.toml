[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iso"
version = "0.1.0"
description = "Drum isolation and a phase-coherent layer kit (pieces, triggers, full kit, room) for mixing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "soxr>=0.3",
  "mido>=1.3",
]

[project.optional-dependencies]
# The separation models (MSST, MIT). Pulls in PyTorch, which uses CUDA on
# NVIDIA, MPS on Apple Silicon, otherwise CPU.
models = ["msst[bs-roformer,scnet,mdx23c,htdemucs]>=0.1,<0.2"]
# Optional alternative backend (python-audio-separator).
audio-separator = ["audio-separator[cpu]>=0.47"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# Importing SFZ sample kits (sfizz, BSD-2).
sfz = ["pysfizz>=0.1"]
all = ["iso[models,ui,sfz]"]
dev = ["pytest>=8", "httpx>=0.27", "iso[ui]"]

[project.scripts]
iso = "iso.cli:main"

[tool.setuptools.packages.find]
include = ["iso*"]

[tool.setuptools.package-data]
iso = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
