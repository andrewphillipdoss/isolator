[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iso"
version = "0.1.0"
description = "Drum isolation and a phase-coherent layer kit (pieces, triggers, full kit, room) for mixing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "soxr>=0.3",
  "mido>=1.3",
]

[project.optional-dependencies]
# The separation models. Pulls in PyTorch; on Apple Silicon this uses MPS,
# on NVIDIA it uses CUDA, otherwise CPU.
models = ["audio-separator[cpu]>=0.47"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8"]

[project.scripts]
iso = "iso.cli:main"

[tool.setuptools.packages.find]
include = ["iso*"]

[tool.setuptools.package-data]
iso = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
